name: Validate Iron Box

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate package
        run: bash scripts/validate.sh
      - name: Test installer
        run: bash tests/test-iron-box-scripts.sh
      - name: Enforce Desktop path boundary
        run: bash tests/test-desktop-path.sh
      - name: Install pinned Codex CLI
        run: npm install --global @openai/codex@0.146.0-alpha.3.1
      - name: Test local marketplace install and runtime payload
        run: python3 tests/test-marketplace-e2e.py

  desktop-path-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce Desktop path boundary (static only)
        run: python tests/check_desktop_path.py
      - name: Install pinned Codex CLI
        run: npm install --global @openai/codex@0.146.0-alpha.3.1
      - name: Test local marketplace install and runtime payload
        run: python tests/test-marketplace-e2e.py
